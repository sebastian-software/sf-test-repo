name: Fake review bot

# Test fixture for Effective Flow merge-gate bot waits on T3 Code (effective-flow#635).
# A `/fakebot review` comment on a pull request starts a non-required check run
# `fakebot/review` on the PR head, keeps it in progress for three minutes, then
# completes it. It deliberately posts no review and no comment.

on:
  issue_comment:
    types: [created]

permissions:
  checks: write
  pull-requests: read

jobs:
  review:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/fakebot review')
    runs-on: ubuntu-latest
    steps:
      - name: Run fake review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          id=$(gh api "repos/$REPO/check-runs" -f name=fakebot/review -f head_sha="$sha" -f status=in_progress --jq .id)
          echo "check run $id on $sha in progress"
          sleep 180
          gh api -X PATCH "repos/$REPO/check-runs/$id" -f status=completed -f conclusion=success \
            -f 'output[title]=Fake review passed' -f 'output[summary]=No findings.'
